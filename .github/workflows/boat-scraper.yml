name: Finn skjærgårdsjeep-varsler

on:
  schedule:
    # Hver 3. time (UTC). Justér ved behov.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # for å committe seen.json tilbake

concurrency:
  group: boat-scraper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boat-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Kjør scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
        run: python main.py

      - name: Commit oppdatert seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: oppdater seen.json [skip ci]"
            git push
          else
            echo "Ingen endringer i seen.json"
          fi
